<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetr Wiki | Intelligence Engine</title>

    <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>
    <script src="https://unpkg.com/compromise"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <script src="https://unpkg.com/franc@6.1.0/dist/franc.min.js"></script>

    <style>
        :root {
            --tetr-green: #004822; --tetr-pink: #F8769A; --tetr-gold: #F0C300;
            --bg: #e9ecef;
        }
        * { box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; height: 100vh; display: flex; flex-direction: column; }

        /* Setup Overlay */
        #setup-overlay {
            position: fixed; inset: 0; background: var(--tetr-green); color: white;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 2000; transition: all 0.8s ease;
        }
        .loading-card { background: rgba(0,0,0,0.2); padding: 30px; border-radius: 20px; text-align: center; max-width: 400px; border: 1px solid var(--tetr-gold); }
        .progress-bar { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 10px; margin: 20px 0; overflow: hidden; }
        #progress-fill { width: 0%; height: 100%; background: var(--tetr-pink); transition: width 0.3s; }

        header { background: var(--tetr-green); color: white; padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        header h1 { margin: 0; font-size: 1.2rem; color: var(--tetr-gold); letter-spacing: 2px; }
        
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .msg { max-width: 80%; padding: 15px 20px; border-radius: 18px; font-size: 0.95rem; line-height: 1.6; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .bot { background: white; align-self: flex-start; border-left: 6px solid var(--tetr-gold); color: #2c3e50; }
        .user { background: var(--tetr-green); color: white; align-self: flex-end; }
        
        .meta-info { font-size: 0.7rem; color: #95a5a6; margin-top: 8px; display: flex; justify-content: space-between; }
        .confidence-pill { background: #ecf0f1; padding: 2px 8px; border-radius: 10px; font-weight: bold; }

        .input-bar { background: white; padding: 20px; display: flex; gap: 12px; border-top: 1px solid #dee2e6; }
        input { flex: 1; padding: 14px 25px; border: 2px solid #f1f3f5; border-radius: 30px; outline: none; }
        .send-btn { background: var(--tetr-green); color: white; border: none; width: 50px; height: 50px; border-radius: 50%; cursor: pointer; font-size: 1.2rem; }
    </style>
</head>
<body>

<div id="setup-overlay">
    <div class="loading-card">
        <h2 style="color: var(--tetr-gold)">TETR AI WIKI</h2>
        <p id="load-status">Initialising AI Engine...</p>
        <div class="progress-bar"><div id="progress-fill"></div></div>
        <p style="font-size: 0.7rem; opacity: 0.7;">Loading MiniLM Model (23MB) to browser cache.</p>
    </div>
</div>

<header>
    <h1>TETR WIKI</h1>
    <div style="font-size: 0.7rem; color: var(--tetr-pink);">• SYSTEM ACTIVE</div>
</header>

<div id="chat-container">
    <div class="msg bot"><b>Tetr AI:</b> Intelligence active. How can I help you today?</div>
</div>

<div class="input-bar">
    <input type="text" id="userInput" placeholder="Ask a question..." onkeypress="if(event.key==='Enter') window.processQuery()">
    <button class="send-btn" onclick="window.processQuery()">➤</button>
</div>

<script type="module">
    // IMPORTANT: Using ES Module import to fix the "Unexpected token export" error
    import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1';

    // Allow local caching
    env.allowLocalModels = false;

    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT9YBoA31_bAI48Dx0Sal0jQpxr6T9V2u7Ry5pnR6R0sCuAaUGSS4skKo-VnkQrJqwylclRylm4zMCW/pub?output=csv";
    
    let kbData = [];
    let fuse;
    let extractor;

    async function initializeSystem() {
        const updateProgress = (pct, msg) => {
            const fill = document.getElementById('progress-fill');
            if(fill) fill.style.width = pct + '%';
            document.getElementById('load-status').innerText = msg;
        };

        try {
            updateProgress(20, "Fetching CSV Data...");
            const response = await fetch(CSV_URL + "?cb=" + Date.now());
            if (!response.ok) throw new Error("CSV Fetch Failed");
            const csvText = await response.text();
            
            kbData = Papa.parse(csvText, { header: true }).data.filter(r => r.Heading);

            updateProgress(50, "Downloading AI Model...");
            // Load the pipeline - this is the 23MB download
            extractor = await pipeline('feature-extraction', 'Xenova/all-MiniLM-L6-v2');

            updateProgress(80, "Optimizing Index...");
            fuse = new Fuse(kbData, { 
                keys: ["Heading", "Content", "Keywords"], 
                threshold: 0.4, 
                includeScore: true 
            });

            updateProgress(100, "Ready!");
            setTimeout(() => {
                document.getElementById('setup-overlay').style.display = 'none';
            }, 800);

        } catch (err) {
            console.error("Initialization Error:", err);
            document.getElementById('load-status').innerText = "Update Failed. Check Console.";
            document.getElementById('load-status').style.color = "var(--tetr-pink)";
        }
    }

    window.processQuery = async function() {
        const inputField = document.getElementById('userInput');
        const query = inputField.value.trim();
        if (!query) return;

        addMessage(query, 'user');
        inputField.value = '';

        // Simple Language Detect using Franc
        const langCode = franc(query, {minLength: 3});
        
        // Search
        const results = fuse.search(query);
        
        if (results.length > 0) {
            const best = results[0].item;
            const conf = Math.round((1 - results[0].score) * 100);
            const response = `<b>${best.Heading}</b><br>${best.Content}<div class="meta-info"><span>Score: ${conf}%</span></div>`;
            addMessage(response, 'bot');
            
            // Speech Output
            const utter = new SpeechSynthesisUtterance(best.Content.substring(0, 150));
            window.speechSynthesis.speak(utter);
        } else {
            addMessage("I couldn't find a clear match. Try different words.", 'bot');
        }
    }

    function addMessage(text, type) {
        const container = document.getElementById('chat-container');
        const div = document.createElement('div');
        div.className = `msg ${type}`;
        div.innerHTML = text;
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
    }

    initializeSystem();
</script>

</body>
</html>
