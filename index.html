<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TETR WIKI | Enterprise AI Engine</title>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <script src="https://unpkg.com/compromise@14.10.1/builds/compromise.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/languagedetect@2.0.0/lib/index.min.js"></script>
    <style>
        :root { --green: #004822; --pink: #F8769A; --gold: #F0C300; }
        body { font-family: sans-serif; background: #f0f2f5; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        #overlay { position: fixed; inset: 0; background: var(--green); color: white; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .bar-bg { width: 300px; height: 10px; background: rgba(255,255,255,0.1); border-radius: 5px; margin: 20px; overflow: hidden; }
        #bar { width: 0%; height: 100%; background: var(--pink); transition: 0.3s; }
        header { background: var(--green); color: var(--gold); padding: 15px 25px; display: flex; justify-content: space-between; border-bottom: 3px solid var(--gold); }
        #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .msg { max-width: 80%; padding: 15px; border-radius: 15px; font-size: 1rem; position: relative; }
        .bot { background: white; align-self: flex-start; border-left: 5px solid var(--gold); }
        .user { background: var(--green); color: white; align-self: flex-end; }
        .score { font-size: 0.7rem; color: #888; margin-top: 5px; display: block; }
        .input-zone { padding: 20px; background: white; display: flex; gap: 10px; border-top: 1px solid #ddd; }
        input { flex: 1; padding: 12px; border-radius: 25px; border: 1px solid #ccc; outline: none; }
        button { background: var(--green); color: white; border: none; padding: 0 25px; border-radius: 25px; cursor: pointer; font-weight: bold; }
        .mic { background: var(--pink); width: 50px; }
    </style>
</head>
<body>

<div id="overlay">
    <h2>TETR AI INITIALIZING</h2>
    <p id="stat">Loading Knowledge Base...</p>
    <div class="bar-bg"><div id="bar"></div></div>
</div>

<header>
    <b>TETR WIKI v17.0</b>
    <span id="lang" style="color:var(--pink)">SYSTEM READY</span>
</header>

<div id="chat"></div>

<div class="input-zone">
    <button class="mic" onclick="startVoice()">🎤</button>
    <input type="text" id="ui" placeholder="Ask about programs, fees, or the founder..." onkeypress="if(event.key==='Enter') window.fireAI()">
    <button onclick="window.fireAI()">SEARCH</button>
</div>

<script type="module">
    import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1';
    env.allowLocalModels = false;
    env.useBrowserCache = true;

    // THE LINK FROM IMAGE_18C89A
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT9YBoA31_bAI48Dx0Sal0jQpxr6T9V2u7Ry5pnR6R0sCuAaUGSS4skKo-VnkQrJqwylclRylm4zMCW/pub?gid=0&single=true&output=csv";
    
    let db = [];
    let engine;
    const ld = new LanguageDetect();

    async function boot() {
        const bar = document.getElementById('bar');
        const stat = document.getElementById('stat');

        try {
            // 1. DATA FETCH
            stat.innerText = "Syncing Sheets Data...";
            bar.style.width = "20%";
            const res = await fetch(CSV_URL + "?v=" + Date.now());
            if(!res.ok) throw new Error("CSV LINK BROKEN (404/400)");
            const text = await res.text();
            db = Papa.parse(text, { header: true, skipEmptyLines: true }).data;
            console.log("Data Loaded:", db.length, "rows");

            // 2. AI MODELS
            stat.innerText = "Loading MiniLM & DistilBERT (91MB)...";
            bar.style.width = "60%";
            await pipeline('feature-extraction', 'Xenova/all-miniLM-L6-v2');
            await pipeline('feature-extraction', 'Xenova/distilbert-base-uncased');

            // 3. FUSE SEARCH
            engine = new Fuse(db, {
                keys: ['Heading', 'Content', 'Keywords'],
                threshold: 0.35, // Stricter matching
                includeScore: true
            });

            bar.style.width = "100%";
            setTimeout(() => {
                document.getElementById('overlay').style.display = 'none';
                add("<b>Tetr AI:</b> Hello! I have processed the 250-page master sheet. Ask me anything.", "bot");
            }, 500);

        } catch (e) {
            stat.innerHTML = "CRITICAL ERROR: " + e.message + "<br>Check your CSV Publish link.";
            stat.style.color = "var(--pink)";
        }
    }

    window.fireAI = function() {
        const input = document.getElementById('ui');
        const q = input.value.trim();
        if(!q) return;

        add(q, 'user');
        input.value = '';

        // NLP Logic
        const detected = ld.detect(q, 1);
        document.getElementById('lang').innerText = detected.length ? detected[0][0].toUpperCase() : "DETECTING";

        // Search
        const results = engine.search(q);
        
        if(results.length > 0) {
            const top = results[0].item;
            const score = Math.round((1 - results[0].score) * 100);
            
            const html = `<b>${top.Heading}</b><br>${top.Content}<span class="score">Confidence: ${score}%</span>`;
            add(html, 'bot');
            
            // Webspeech
            const utterance = new SpeechSynthesisUtterance(top.Content.substring(0, 200));
            window.speechSynthesis.speak(utterance);
        } else {
            add("I couldn't find an answer for that. Please try searching for 'Admission', 'Fees', or 'Founder'.", "bot");
        }
    };

    window.startVoice = function() {
        const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if(!Rec) return alert("Browser does not support voice.");
        const r = new Rec();
        r.onresult = (e) => document.getElementById('ui').value = e.results[0][0].transcript;
        r.start();
    };

    function add(t, c) {
        const chat = document.getElementById('chat');
        const d = document.createElement('div');
        d.className = `msg ${c}`;
        d.innerHTML = t;
        chat.appendChild(d);
        chat.scrollTop = chat.scrollHeight;
    }

    boot();
</script>
</body>
</html>
