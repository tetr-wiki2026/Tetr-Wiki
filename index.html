<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TETR AI | V18.0 FINAL</title>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <script src="https://unpkg.com/compromise@14.10.1/builds/compromise.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/languagedetect@2.0.0/lib/index.min.js"></script>

    <style>
        :root { --green: #004822; --pink: #F8769A; --gold: #F0C300; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        #loader { position: fixed; inset: 0; background: var(--green); color: white; z-index: 999; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .bar-container { width: 300px; height: 10px; background: rgba(255,255,255,0.1); border-radius: 5px; margin: 20px; overflow: hidden; }
        #progress-bar { width: 0%; height: 100%; background: var(--pink); transition: 0.4s; }
        header { background: var(--green); color: var(--gold); padding: 15px 25px; display: flex; justify-content: space-between; border-bottom: 4px solid var(--gold); font-weight: 800; }
        #chat { flex: 1; overflow-y: auto; padding: 25px; display: flex; flex-direction: column; gap: 15px; }
        .msg { max-width: 80%; padding: 15px 20px; border-radius: 20px; line-height: 1.5; font-size: 1rem; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .bot { background: white; align-self: flex-start; border-left: 6px solid var(--gold); }
        .user { background: var(--green); color: white; align-self: flex-end; }
        .input-box { padding: 25px; background: white; display: flex; gap: 10px; border-top: 1px solid #ddd; }
        input { flex: 1; padding: 15px 25px; border-radius: 30px; border: 2px solid #eee; outline: none; }
        button { background: var(--green); color: white; border: none; padding: 0 30px; border-radius: 30px; cursor: pointer; font-weight: bold; }
        #lang-tag { color: var(--pink); font-size: 0.7rem; }
    </style>
</head>
<body>

<div id="loader">
    <h1 style="letter-spacing: 3px;">TETR AI BOOTING</h1>
    <p id="boot-status">Initializing Data Pipeline...</p>
    <div class="bar-container"><div id="progress-bar"></div></div>
</div>

<header>
    <span>TETR WIKI v18.0</span>
    <span id="lang-tag">STATION READY</span>
</header>

<div id="chat"></div>

<div class="input-box">
    <input type="text" id="userInput" placeholder="Ask about programs or fees..." onkeypress="if(event.key==='Enter') triggerSearch()">
    <button onclick="triggerSearch()">SEARCH</button>
</div>

<script type="module">
    import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1';
    
    // Fixed URL format for direct fetch
    const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT9YBoA31_bAI48Dx0Sal0jQpxr6T9V2u7Ry5pnR6R0sCuAaUGSS4skKo-VnkQrJqwylclRylm4zMCW/pub?gid=0&single=true&output=csv";
    
    let wikiData = [];
    let fuse;
    const ld = new LanguageDetect();

    async function init() {
        const bar = document.getElementById('progress-bar');
        const status = document.getElementById('boot-status');

        try {
            // 1. DATA FETCH
            status.innerText = "Connecting to Knowledge Base...";
            bar.style.width = "20%";
            const res = await fetch(SHEET_URL + "&cache=" + Date.now());
            if(!res.ok) throw new Error("Connection Refused by Sheets (400)");
            const text = await res.text();
            wikiData = Papa.parse(text, { header: true, skipEmptyLines: true }).data;

            // 2. AI MODEL LOAD
            status.innerText = "Loading AI Semantic Engines (91MB)...";
            bar.style.width = "60%";
            await pipeline('feature-extraction', 'Xenova/all-miniLM-L6-v2');
            await pipeline('feature-extraction', 'Xenova/distilbert-base-uncased');

            // 3. SEARCH ENGINE
            fuse = new Fuse(wikiData, {
                keys: ['Heading', 'Content', 'Keywords'],
                threshold: 0.4,
                includeScore: true
            });

            bar.style.width = "100%";
            setTimeout(() => {
                document.getElementById('loader').style.display = 'none';
                addMessage("<b>Tetr AI:</b> Master sheet loaded. I am ready to answer your questions.", "bot");
            }, 500);

        } catch (e) {
            status.innerText = "FAILED: " + e.message;
            status.style.color = "var(--pink)";
        }
    }

    window.triggerSearch = function() {
        const input = document.getElementById('userInput');
        const query = input.value.trim();
        if(!query) return;

        addMessage(query, 'user');
        input.value = '';

        // Update Language Detection
        const detected = ld.detect(query, 1);
        document.getElementById('lang-tag').innerText = detected.length ? detected[0][0].toUpperCase() : "EN";

        // Perform Search
        const results = fuse.search(query);
        if(results.length > 0) {
            const top = results[0].item;
            const confidence = Math.round((1 - results[0].score) * 100);
            addMessage(`<b>${top.Heading}</b><br>${top.Content}<br><br><small style="opacity:0.5">Match Confidence: ${confidence}%</small>`, 'bot');
            
            // TTS
            window.speechSynthesis.speak(new SpeechSynthesisUtterance(top.Content.substring(0, 200)));
        } else {
            addMessage("I couldn't find a direct match. Please try keywords like 'Fees' or 'Process'.", "bot");
        }
    }

    function addMessage(t, c) {
        const chat = document.getElementById('chat');
        const div = document.createElement('div');
        div.className = `msg ${c}`;
        div.innerHTML = t;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }

    init();
</script>
</body>
</html>
