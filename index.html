<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TETR WIKI - DEBUG VERSION</title>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: monospace; background: #004822; height: 100vh; display: flex; flex-direction: column; }
        
        header { background: #004822; color: #009C50; padding: 1rem; border-bottom: 2px solid #009C50; }
        .chat-area { flex: 1; overflow-y: auto; padding: 1rem; background: white; }
        .message { padding: 0.5rem; margin: 0.5rem 0; border-radius: 8px; }
        .user { background: #009C50; color: white; text-align: right; }
        .bot { background: #e0e0e0; color: #004822; border-left: 4px solid #009C50; }
        .debug-panel { background: #1a1a1a; color: #0f0; padding: 0.5rem; font-size: 0.7rem; max-height: 150px; overflow-y: auto; font-family: monospace; }
        .input-area { padding: 1rem; background: white; display: flex; gap: 0.5rem; }
        input { flex: 1; padding: 0.5rem; border: 1px solid #004822; border-radius: 4px; }
        button { background: #004822; color: white; padding: 0.5rem 1rem; border: none; cursor: pointer; }
        .status { background: #009C50; color: white; padding: 0.3rem; font-size: 0.8rem; text-align: center; }
    </style>
</head>
<body>

<header>
    <h2>TETR WIKI - DEBUG MODE</h2>
</header>

<div class="status" id="statusBar">Initializing...</div>

<div class="chat-area" id="chat"></div>

<div class="debug-panel" id="debugPanel">
    📡 Debug console will appear here<br>
</div>

<div class="input-area">
    <input type="text" id="userInput" placeholder="Ask a question..." onkeypress="if(event.key==='Enter') ask()">
    <button onclick="ask()">ASK</button>
    <button onclick="clearDebug()" style="background:#666;">Clear Debug</button>
</div>

<script>
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT9YBoA31_bAI48Dx0Salj0Qpxr6T9V2u7Ry5pnR6R0sCuAaUGSS4skKo-VnkQrJqwylclRylm4zMCW/pub?gid=0&single=true&output=csv";
    
    let knowledgeBase = [];
    let fuseIndex = null;
    let columnNames = [];
    
    function logToDebug(message, isError = false) {
        const debugPanel = document.getElementById('debugPanel');
        const timestamp = new Date().toLocaleTimeString();
        const color = isError ? '#ff6b6b' : '#0f0';
        debugPanel.innerHTML += `<div style="color: ${color}; border-top: 1px solid #333; padding: 2px 0;">[${timestamp}] ${message}</div>`;
        debugPanel.scrollTop = debugPanel.scrollHeight;
        console.log(message);
    }
    
    function updateStatus(message, isError = false) {
        const statusBar = document.getElementById('statusBar');
        statusBar.innerHTML = message;
        statusBar.style.background = isError ? '#c0392b' : '#009C50';
        logToDebug(`STATUS: ${message}`, isError);
    }
    
    function addMessage(text, sender) {
        const chat = document.getElementById('chat');
        const div = document.createElement('div');
        div.className = `message ${sender}`;
        div.innerHTML = text;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }
    
    async function loadCSV() {
        updateStatus("Loading CSV from Google Sheets...");
        logToDebug(`Fetching: ${CSV_URL}`);
        
        try {
            // Direct fetch with no caching to test
            const response = await fetch(CSV_URL, {
                cache: 'no-store',
                headers: { 'Cache-Control': 'no-cache' }
            });
            
            logToDebug(`Response status: ${response.status} ${response.statusText}`);
            
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}: ${response.statusText}`);
            }
            
            const csvText = await response.text();
            logToDebug(`CSV downloaded: ${csvText.length} characters`);
            
            // Show first 200 chars of raw CSV
            logToDebug(`Raw CSV preview: ${csvText.substring(0, 200)}...`);
            
            // Parse CSV
            const result = Papa.parse(csvText, { 
                header: true, 
                skipEmptyLines: true,
                transformHeader: (h) => h.trim()
            });
            
            logToDebug(`PapaParse complete. Errors: ${result.errors.length}`);
            
            if (result.errors.length > 0) {
                logToDebug(`Parse errors: ${JSON.stringify(result.errors[0])}`, true);
            }
            
            knowledgeBase = result.data;
            logToDebug(`Rows parsed: ${knowledgeBase.length}`);
            
            if (knowledgeBase.length === 0) {
                throw new Error("CSV is empty or parsing failed");
            }
            
            // Get column names
            columnNames = Object.keys(knowledgeBase[0]);
            logToDebug(`Columns found: ${columnNames.join(', ')}`);
            
            // Show first row
            logToDebug(`First row sample: ${JSON.stringify(knowledgeBase[0]).substring(0, 300)}`);
            
            // Filter out completely empty rows
            const beforeFilter = knowledgeBase.length;
            knowledgeBase = knowledgeBase.filter(row => {
                return columnNames.some(col => row[col] && row[col].toString().trim().length > 0);
            });
            logToDebug(`After removing empty rows: ${knowledgeBase.length} (removed ${beforeFilter - knowledgeBase.length})`);
            
            if (knowledgeBase.length === 0) {
                throw new Error("No valid data rows found");
            }
            
            // Build Fuse index
            const searchKeys = columnNames.filter(col => col !== 'ID');
            logToDebug(`Building Fuse index with keys: ${searchKeys.join(', ')}`);
            
            fuseIndex = new Fuse(knowledgeBase, {
                keys: searchKeys,
                threshold: 0.4,
                includeScore: true,
                minMatchCharLength: 2
            });
            
            updateStatus(`✅ Ready! Loaded ${knowledgeBase.length} records. Columns: ${columnNames.join(', ')}`);
            addMessage(`✅ System ready! Loaded ${knowledgeBase.length} entries from your CSV.`, 'bot');
            addMessage(`📊 Available columns: ${columnNames.join(', ')}`, 'bot');
            addMessage(`💡 Try asking something like: "${knowledgeBase[0][columnNames[1]] || knowledgeBase[0][columnNames[0]]}"`, 'bot');
            
        } catch (error) {
            logToDebug(`ERROR: ${error.message}`, true);
            updateStatus(`❌ Error: ${error.message}`, true);
            addMessage(`❌ Failed to load CSV: ${error.message}\n\nPlease check:\n1. The Google Sheet is public\n2. The URL is correct\n3. The CSV export is working`, 'bot');
        }
    }
    
    function ask() {
        const input = document.getElementById('userInput');
        const question = input.value.trim();
        
        if (!question) {
            logToDebug("Empty question ignored");
            return;
        }
        
        logToDebug(`User asked: "${question}"`);
        addMessage(question, 'user');
        input.value = '';
        
        if (!fuseIndex || knowledgeBase.length === 0) {
            const errorMsg = "Knowledge base not loaded yet. Please wait or refresh the page.";
            logToDebug(errorMsg, true);
            addMessage(errorMsg, 'bot');
            return;
        }
        
        logToDebug(`Searching ${knowledgeBase.length} documents...`);
        const results = fuseIndex.search(question);
        logToDebug(`Found ${results.length} results`);
        
        if (results.length === 0) {
            addMessage("❌ No matches found. Please try different keywords.", 'bot');
            // Show sample of what's in the database
            const sample = knowledgeBase.slice(0, 3).map(row => {
                const firstCol = columnNames[1] || columnNames[0];
                return row[firstCol];
            }).join(', ');
            addMessage(`📚 Database contains topics like: ${sample}`, 'bot');
            return;
        }
        
        const best = results[0];
        const score = best.score;
        const confidence = Math.round((1 - Math.min(score, 1)) * 100);
        
        logToDebug(`Best match score: ${score}, confidence: ${confidence}%`);
        logToDebug(`Match details: ${JSON.stringify(best.item).substring(0, 200)}`);
        
        // Build answer from available columns
        let answerHtml = `<b>🔍 Match found (${confidence}% confidence)</b><br><br>`;
        
        // Display all non-empty fields
        for (let col of columnNames) {
            const value = best.item[col];
            if (value && value.toString().trim()) {
                answerHtml += `<b>${col}:</b> ${value}<br><br>`;
            }
        }
        
        addMessage(answerHtml, 'bot');
    }
    
    function clearDebug() {
        document.getElementById('debugPanel').innerHTML = "📡 Debug console cleared<br>";
        logToDebug("Debug console cleared");
    }
    
    // Start loading
    loadCSV();
</script>
</body>
</html>
