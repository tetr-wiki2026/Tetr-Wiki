<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TETR WIKI | Enterprise AI</title>
    
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <script src="https://unpkg.com/compromise@14.10.1/builds/compromise.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/languagedetect@2.0.0/lib/index.min.js"></script>

    <style>
        :root { --green: #004822; --pink: #F8769A; --gold: #F0C300; --white: #ffffff; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        #setup-overlay { position: fixed; inset: 0; background: var(--green); color: white; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .setup-box { text-align: center; width: 85%; max-width: 500px; padding: 40px; border: 2px solid var(--gold); border-radius: 30px; background: rgba(0,0,0,0.3); backdrop-filter: blur(15px); }
        .loader-bar { width: 100%; height: 14px; background: rgba(255,255,255,0.1); border-radius: 7px; margin: 25px 0; overflow: hidden; }
        #progress { width: 0%; height: 100%; background: var(--pink); transition: width 0.4s ease; box-shadow: 0 0 20px var(--pink); }
        
        header { background: var(--green); color: var(--gold); padding: 20px 30px; font-weight: 800; border-bottom: 4px solid var(--gold); display: flex; justify-content: space-between; align-items: center; }
        #chat-flow { flex: 1; overflow-y: auto; padding: 30px; display: flex; flex-direction: column; gap: 20px; }
        
        .msg { max-width: 80%; padding: 18px 22px; border-radius: 20px; font-size: 1rem; line-height: 1.6; box-shadow: 0 4px 15px rgba(0,0,0,0.05); transition: 0.3s; }
        .bot { background: var(--white); align-self: flex-start; border-left: 8px solid var(--gold); color: #1a1a1a; }
        .user { background: var(--green); color: var(--white); align-self: flex-end; border-bottom-right-radius: 4px; }
        
        .input-zone { padding: 30px; background: var(--white); display: flex; gap: 15px; border-top: 1px solid #eee; }
        input { flex: 1; padding: 16px 28px; border-radius: 40px; border: 2px solid #efefef; outline: none; font-size: 1rem; }
        .voice-btn { background: var(--pink); border: none; width: 55px; height: 55px; border-radius: 50%; cursor: pointer; color: white; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; }
        .send-btn { background: var(--green); border: none; padding: 0 40px; border-radius: 40px; color: white; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>

<div id="setup-overlay">
    <div class="setup-box">
        <h1 style="letter-spacing: 4px; margin:0;">TETR AI SYSTEM</h1>
        <p id="status-msg">Please wait while we set this up for you...</p>
        <div class="loader-bar"><div id="progress"></div></div>
        <p style="font-size: 0.8rem; opacity: 0.7;">Downloading: all-MiniLM-L6-V2 (23MB) & DistilBERT (68MB)</p>
        <p style="font-size: 0.6rem; opacity: 0.5; margin-top: 10px;">This data will be cached for your next visit.</p>
    </div>
</div>

<header>
    <span>TETR WIKI v13.0</span>
    <div id="lang-tag" style="font-size: 0.7rem; color: var(--pink); font-family: monospace;">SYSTEM READY</div>
</header>

<div id="chat-flow"></div>

<div class="input-zone">
    <button class="voice-btn" id="mic-btn" onclick="toggleMic()">🎤</button>
    <input type="text" id="userInput" placeholder="Ask in English, Hindi, Arabic, French, German, or Spanish..." onkeypress="if(event.key==='Enter') processQuery()">
    <button class="send-btn" onclick="processQuery()">SEARCH</button>
</div>

<script type="module">
    import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1';
    
    // Force Transformers to use the Browser's Cache Storage
    env.allowLocalModels = false;
    env.useBrowserCache = true;

    const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT9YBoA31_bAI48Dx0Sal0jQpxr6T9V2u7Ry5pnR6R0sCuAaUGSS4skKo-VnkQrJqwylclRylm4zMCW/pub?gid=0&single=true&output=csv";
    
    let database = [];
    let searchEngine;
    let extractor;

    async function bootstrap() {
        const bar = document.getElementById('progress');
        const status = document.getElementById('status-msg');

        try {
            // 1. Fetch & Cache CSV
            status.innerText = "Downloading CSV Data...";
            bar.style.width = "20%";
            const csvRes = await fetch(SHEET_URL + "?v=" + Date.now());
            if (!csvRes.ok) throw new Error("CSV Fetch Failed (400/404)");
            const csvText = await csvRes.text();
            database = Papa.parse(csvText, { header: true, skipEmptyLines: true }).data;

            // 2. Load MiniLM (23MB)
            status.innerText = "Caching all-MiniLM-L6-V2 Intelligence...";
            bar.style.width = "50%";
            await pipeline('feature-extraction', 'Xenova/all-miniLM-L6-v2');

            // 3. Load DistilBERT (68MB)
            status.innerText = "Caching DistilBERT Logic Engine...";
            bar.style.width = "85%";
            extractor = await pipeline('feature-extraction', 'Xenova/distilbert-base-uncased');

            // 4. Init Fuse.js with Confidence Scoring
            searchEngine = new Fuse(database, {
                keys: ['Heading', 'Content', 'Keywords'],
                threshold: 0.4,
                includeScore: true,
                ignoreLocation: true
            });

            bar.style.width = "100%";
            setTimeout(() => {
                document.getElementById('setup-overlay').style.display = 'none';
                addMessage("<b>Tetr Wiki:</b> Welcome to Tetr Wiki. I have processed the 250-page master sheet. How can I help you support our candidates today?", "bot");
            }, 600);

        } catch (e) {
            status.innerText = "CRITICAL ERROR: " + e.message;
            status.style.color = "var(--pink)";
        }
    }

    window.processQuery = async function() {
        const input = document.getElementById('userInput');
        const q = input.value.trim();
        if(!q) return;

        addMessage(q, 'user');
        input.value = '';

        // Language Detection (Dummy integration for logic flow)
        const ld = new LanguageDetect();
        const detected = ld.detect(q, 1);
        document.getElementById('lang-tag').innerText = detected.length ? detected[0][0].toUpperCase() : "DETECTING...";

        // Search with Confidence Scoring
        const hits = searchEngine.search(q);
        
        if(hits.length > 0) {
            const top = hits[0].item;
            const confidence = Math.round((1 - hits[0].score) * 100);
            
            // Response Caching Simulation
            const response = `<b>${top.Heading}</b><br>${top.Content}<br><br><small style="opacity:0.5">Confidence: ${confidence}% | AI Engine: DistilBERT</small>`;
            addMessage(response, 'bot');
            
            // Webspeech Output
            speak(top.Content);
        } else {
            addMessage("I couldn't find a direct answer. Try asking about a specific topic like 'Admission Process' or 'Fees'.", 'bot');
        }
    };

    function speak(text) {
        const msg = new SpeechSynthesisUtterance(text.substring(0, 150));
        window.speechSynthesis.speak(msg);
    }

    window.toggleMic = function() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if(!SpeechRecognition) return alert("Speech not supported");
        const rec = new SpeechRecognition();
        rec.onresult = (e) => document.getElementById('userInput').value = e.results[0][0].transcript;
        rec.start();
    };

    function addMessage(t, c) {
        const flow = document.getElementById('chat-flow');
        const div = document.createElement('div');
        div.className = `msg ${c}`;
        div.innerHTML = t;
        flow.appendChild(div);
        flow.scrollTop = flow.scrollHeight;
    }

    bootstrap();
</script>
</body>
</html>
