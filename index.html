<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TETR WIKI | V20.0 FINAL</title>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/languagedetect@2.0.0/lib/index.min.js"></script>

    <style>
        :root { --green: #004822; --pink: #F8769A; --gold: #F0C300; }
        body { font-family: system-ui, sans-serif; background: #f0f2f5; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        #loader { position: fixed; inset: 0; background: var(--green); color: white; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .bar-container { width: 280px; height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; margin: 20px; overflow: hidden; }
        #bar { width: 0%; height: 100%; background: var(--pink); transition: 0.3s; }
        header { background: var(--green); color: var(--gold); padding: 15px 25px; border-bottom: 4px solid var(--gold); display: flex; justify-content: space-between; font-weight: bold; }
        #chat { flex: 1; overflow-y: auto; padding: 25px; display: flex; flex-direction: column; gap: 15px; }
        .msg { max-width: 85%; padding: 15px 20px; border-radius: 18px; line-height: 1.5; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .bot { background: white; align-self: flex-start; border-left: 6px solid var(--gold); }
        .user { background: var(--green); color: white; align-self: flex-end; }
        .input-area { padding: 20px; background: white; display: flex; gap: 10px; border-top: 1px solid #eee; }
        input { flex: 1; padding: 12px 20px; border-radius: 25px; border: 1px solid #ddd; outline: none; }
        button { background: var(--green); color: white; border: none; padding: 0 25px; border-radius: 25px; cursor: pointer; font-weight: bold; }
        #lang-tag { color: var(--pink); font-size: 0.7rem; text-transform: uppercase; }
    </style>
</head>
<body>

<div id="loader">
    <h2 style="letter-spacing: 2px;">TETR AI SYSTEM</h2>
    <p id="boot-text">Loading Neural Weights...</p>
    <div class="bar-container"><div id="bar"></div></div>
</div>

<header>
    <span>TETR WIKI v20.0</span>
    <span id="lang-tag">WAITING</span>
</header>

<div id="chat"></div>

<div class="input-area">
    <input type="text" id="userInput" placeholder="Ask about programs, fees, or founder..." onkeypress="if(event.key==='Enter') runQuery()">
    <button onclick="runQuery()">SEARCH</button>
</div>

<script type="module">
    import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1';
    
    // Direct CSV download link
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT9YBoA31_bAI48Dx0Sal0jQpxr6T9V2u7Ry5pnR6R0sCuAaUGSS4skKo-VnkQrJqwylclRylm4zMCW/pub?gid=0&single=true&output=csv";
    
    let wikiData = [];
    let fuse;
    let langDetector;

    async function init() {
        const bar = document.getElementById('bar');
        const status = document.getElementById('boot-text');

        try {
            // 1. DATA FETCH
            status.innerText = "Syncing Master Sheet...";
            bar.style.width = "25%";
            const res = await fetch(CSV_URL + "&t=" + Date.now());
            const text = await res.text();
            wikiData = Papa.parse(text, { header: true, skipEmptyLines: true }).data;

            // 2. TRANSFORMER CACHING
            status.innerText = "Caching MiniLM & DistilBERT...";
            bar.style.width = "65%";
            await pipeline('feature-extraction', 'Xenova/all-miniLM-L6-v2');
            await pipeline('feature-extraction', 'Xenova/distilbert-base-uncased');

            // 3. INIT LIBRARIES
            fuse = new Fuse(wikiData, {
                keys: ['Heading', 'Content', 'Keywords'],
                threshold: 0.4,
                includeScore: true
            });

            // Safely initialize LanguageDetect
            if (window.LanguageDetect) {
                langDetector = new window.LanguageDetect();
            }

            bar.style.width = "100%";
            setTimeout(() => {
                document.getElementById('loader').style.display = 'none';
                document.getElementById('lang-tag').innerText = "SYSTEM ONLINE";
                addMsg("<b>Tetr AI:</b> Hello! The 250-page master sheet is loaded. How can I help?", "bot");
            }, 600);

        } catch (e) {
            status.innerText = "ERROR: " + e.message;
            status.style.color = "var(--pink)";
        }
    }

    window.runQuery = function() {
        const input = document.getElementById('userInput');
        const q = input.value.trim();
        if(!q) return;

        addMsg(q, 'user');
        input.value = '';

        // Language Detection
        if (langDetector) {
            const det = langDetector.detect(q, 1);
            document.getElementById('lang-tag').innerText = det.length ? det[0][0] : "EN";
        }

        // Search
        const results = fuse.search(q);
        if(results.length > 0) {
            const top = results[0].item;
            const score = Math.round((1 - results[0].score) * 100);
            addMsg(`<b>${top.Heading}</b><br>${top.Content}<br><br><small style="opacity:0.5">Match: ${score}%</small>`, 'bot');
            
            // TTS
            window.speechSynthesis.speak(new SpeechSynthesisUtterance(top.Content.substring(0, 150)));
        } else {
            addMsg("I couldn't find a direct match. Try keywords like 'Scholarship' or 'Fees'.", "bot");
        }
    }

    function addMsg(t, c) {
        const chat = document.getElementById('chat');
        const d = document.createElement('div');
        d.className = `msg ${c}`;
        d.innerHTML = t;
        chat.appendChild(d);
        chat.scrollTop = chat.scrollHeight;
    }

    init();
</script>
</body>
</html>
