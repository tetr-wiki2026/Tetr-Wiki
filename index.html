<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TETR WIKI</title>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <style>
        :root { --dark-green: #004822; --light-green: #009C50; --white: #FFFFFF; }
        body { font-family: 'Segoe UI', sans-serif; background: #f4f4f4; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background: var(--dark-green); color: var(--white); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--light-green); }
        #user-welcome { color: var(--white); font-weight: 500; }
        #loader { position: fixed; inset: 0; background: var(--dark-green); color: var(--white); z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .spinner { width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid var(--light-green); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        #chat-window { flex: 1; overflow-y: auto; padding: 30px; display: flex; flex-direction: column; gap: 20px; }
        .msg { max-width: 80%; padding: 18px 22px; border-radius: 15px; font-size: 1rem; line-height: 1.6; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .bot { background: var(--white); color: #333; align-self: flex-start; border-left: 6px solid var(--light-green); }
        .user { background: var(--dark-green); color: var(--white); align-self: flex-end; }
        .listen-btn { background: var(--light-green); color: white; border: none; border-radius: 20px; padding: 6px 16px; cursor: pointer; margin-top: 10px; font-weight: bold; }
        .dock { padding: 25px; background: var(--white); display: flex; gap: 12px; border-top: 1px solid #eee; align-items: center; }
        input { flex: 1; padding: 14px 25px; border-radius: 30px; border: 2px solid #eee; outline: none; }
        .mic-btn { background: #f0f0f0; border: none; width: 50px; height: 50px; border-radius: 50%; cursor: pointer; font-size: 1.4rem; display: flex; align-items: center; justify-content: center; }
        .mic-active { background: #ff4b2b; color: white; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        .send-btn { background: var(--dark-green); color: var(--white); border: none; padding: 0 35px; height: 50px; border-radius: 30px; cursor: pointer; font-weight: 700; }
    </style>
</head>
<body>

<div id="loader">
    <div class="spinner"></div>
    <h2 style="margin-top:20px;">TETR AI INITIALIZING</h2>
    <p id="status">Connecting to Knowledge Base...</p>
</div>

<header>
    <span style="font-weight: 700;">TETR WIKI</span>
    <span id="user-welcome">Welcome @user</span>
</header>

<div id="chat-window"></div>

<div class="dock">
    <button id="micBtn" class="mic-btn" onclick="toggleVoice()">🎤</button>
    <input type="text" id="userInput" placeholder="Ask about programs, fees, or founder..." onkeypress="if(event.key==='Enter') searchSemantic()">
    <button class="send-btn" onclick="searchSemantic()">SEARCH</button>
</div>

<script type="module">
    import { pipeline } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1';
    
    // MAKE SURE THIS LINK ENDS IN output=csv
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT9YBoA31_bAI48Dx0Sal0jQpxr6T9V2u7Ry5pnR6R0sCuAaUGSS4skKo-VnkQrJqwylclRylm4zMCW/pub?gid=0&single=true&output=csv";
    
    let db = [];
    let embedder;
    let recognition;
    let isListening = false;

    async function init() {
        const status = document.getElementById('status');
        try {
            // 1. Validate Spreadsheet Data first
            status.innerText = "Downloading Spreadsheet...";
            const res = await fetch(CSV_URL + "&v=" + Date.now());
            if (!res.ok) throw new Error("Spreadsheet Link Rejected (404/400). Please check CSV Publish settings.");
            
            const text = await res.text();
            db = Papa.parse(text, { header: true, skipEmptyLines: true }).data;
            if (db.length === 0) throw new Error("Spreadsheet is empty.");

            // 2. Load AI Model
            status.innerText = "Loading AI Semantic Brain (MiniLM)...";
            embedder = await pipeline('feature-extraction', 'Xenova/all-MiniLM-L6-v2');

            // 3. Setup Voice
            const SpeechAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
            if(SpeechAPI) {
                recognition = new SpeechAPI();
                recognition.onresult = (e) => {
                    document.getElementById('userInput').value = e.results[0][0].transcript;
                    if(isListening) toggleVoice();
                    searchSemantic();
                };
            }

            document.getElementById('loader').style.display = 'none';
            addMsg("<b>Tetr Wiki:</b> Knowledge Base Loaded. I can now understand columns B, C, D, and E semantically.", "bot");
        } catch (e) {
            status.innerHTML = `<span style="color:#ff4b2b">ERROR: ${e.message}</span><br>Ensure Sheet is published as CSV.`;
            console.error(e);
        }
    }

    function cosineSimilarity(a, b) {
        return a.reduce((sum, val, i) => sum + val * b[i], 0);
    }

    window.searchSemantic = async function() {
        const input = document.getElementById('userInput');
        const query = input.value.trim();
        if(!query || !embedder) return;

        addMsg(query, 'user');
        input.value = '';

        const qOutput = await embedder(query, { pooling: 'mean', normalize: true });
        const qVector = Array.from(qOutput.data);

        let bestMatch = null;
        let maxSim = -1;

        for (let row of db) {
            // Merge all columns B, C, D, E for the search logic
            const rowContext = Object.values(row).join(" ");
            const rOutput = await embedder(rowContext, { pooling: 'mean', normalize: true });
            const rVector = Array.from(rOutput.data);
            
            const sim = cosineSimilarity(qVector, rVector);
            if (sim > maxSim) {
                maxSim = sim;
                bestMatch = row;
            }
        }

        if (bestMatch && maxSim > 0.35) {
            // Use Index 0 for Heading (Col B) and Index 1 for Content (Col C)
            const rowArr = Object.values(bestMatch);
            const html = `
                <b style="color:var(--dark-green)">${rowArr[0]}</b><br>${rowArr[1]}
                <br><button class="listen-btn" onclick="speak(\`${rowArr[1].replace(/'/g, "\\'")}\`)">Listen to Answer</button>
            `;
            addMsg(html, 'bot');
        } else {
            addMsg("I couldn't find a confident semantic match. Please try different keywords.", "bot");
        }
    }

    window.toggleVoice = () => {
        if(!recognition) return alert("Speech recognition not supported.");
        const btn = document.getElementById('micBtn');
        if(isListening) { recognition.stop(); isListening = false; btn.classList.remove('mic-active'); }
        else { recognition.start(); isListening = true; btn.classList.add('mic-active'); }
    };

    window.speak = (t) => {
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(new SpeechSynthesisUtterance(t.substring(0, 500)));
    };

    function addMsg(t, c) {
        const win = document.getElementById('chat-window');
        if(!win) return;
        const d = document.createElement('div');
        d.className = `msg ${c}`;
        d.innerHTML = t;
        win.appendChild(d);
        win.scrollTop = win.scrollHeight;
    }

    init();
</script>
</body>
</html>
