<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetr Wiki | Sales Assistant</title>
    
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <script src="https://unpkg.com/franc@6.1.0/dist/franc.min.js"></script>

    <style>
        :root { --green: #004822; --pink: #F8769A; --gold: #F0C300; --white: #ffffff; }
        body { font-family: 'Inter', sans-serif; background: #f8f9fa; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* High-End Loading Screen */
        #loader { position: fixed; inset: 0; background: var(--green); color: white; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.6s ease; }
        .loader-content { text-align: center; width: 80%; max-width: 400px; }
        .progress-container { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 10px; margin: 25px 0; overflow: hidden; }
        #progress-bar { width: 0%; height: 100%; background: var(--pink); transition: width 0.4s ease; box-shadow: 0 0 10px var(--pink); }
        
        /* Chat Layout */
        header { background: var(--green); padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--gold); }
        #chat-window { flex: 1; overflow-y: auto; padding: 25px; display: flex; flex-direction: column; gap: 15px; }
        .msg { max-width: 80%; padding: 15px; border-radius: 18px; line-height: 1.5; font-size: 0.95rem; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .bot { background: var(--white); align-self: flex-start; border-left: 5px solid var(--gold); color: #333; }
        .user { background: var(--green); color: var(--white); align-self: flex-end; border-bottom-right-radius: 2px; }
        
        .footer-input { background: var(--white); padding: 20px; display: flex; gap: 12px; border-top: 1px solid #eee; }
        input { flex: 1; padding: 14px 20px; border: 2px solid #f1f3f5; border-radius: 30px; outline: none; transition: 0.2s; }
        input:focus { border-color: var(--pink); }
        button { background: var(--green); border: none; width: 50px; height: 50px; border-radius: 50%; color: var(--white); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; transition: 0.3s; }
        button:hover { background: var(--pink); transform: scale(1.05); }
    </style>
</head>
<body>

<div id="loader">
    <div class="loader-content">
        <h1 style="color: var(--gold); letter-spacing: 3px; margin:0;">TETR WIKI</h1>
        <p id="status-text" style="opacity: 0.8; margin-top: 10px;">Initializing Knowledge Base...</p>
        <div class="progress-container"><div id="progress-bar"></div></div>
    </div>
</div>

<header>
    <div style="font-weight: bold; color: var(--gold); letter-spacing: 1px;">TETR AI v2.0</div>
    <div id="connection-status" style="font-size: 0.7rem; color: var(--pink);">● OFFLINE SYNC ACTIVE</div>
</header>

<div id="chat-window">
    <div class="msg bot"><b>Tetr Assistant:</b> I've successfully loaded the latest data from your Google Sheet. What can I help you find?</div>
</div>

<div class="footer-input">
    <input type="text" id="userInput" placeholder="Search the Wiki (e.g., Founders, Tuition, Campus)..." onkeypress="if(event.key==='Enter') window.askBot()">
    <button onclick="window.askBot()">➤</button>
</div>

<script type="module">
    // Direct Import of Transformers AI model
    import { pipeline } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1';

    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT9YBoA31_bAI48Dx0Sal0jQpxr6T9V2u7Ry5pnR6R0sCuAaUGSS4skKo-VnkQrJqwylclRylm4zMCW/pub?gid=0&single=true&output=csv";
    
    let kbData = [];
    let fuseIndex;
    let classifier;

    async function initialize() {
        const bar = document.getElementById('progress-bar');
        const status = document.getElementById('status-text');

        try {
            // 1. Fetch CSV with cache busting
            status.innerText = "Syncing with Google Sheets...";
            bar.style.width = "30%";
            const response = await fetch(CSV_URL + "&t=" + Date.now());
            if (!response.ok) throw new Error("Sheet not reachable");
            const csvText = await response.text();
            
            // 2. Parse Data
            kbData = Papa.parse(csvText, { header: true, skipEmptyLines: true }).data;
            bar.style.width = "50%";

            // 3. Load Transformers AI (The big download)
            status.innerText = "Waking up AI Brain (23MB)...";
            bar.style.width = "70%";
            // We initialize the pipeline - it will cache itself after the first run
            await pipeline('feature-extraction', 'Xenova/all-MiniLM-L6-v2');
            
            // 4. Setup Fuzzy Search
            status.innerText = "Indexing Knowledge...";
            fuseIndex = new Fuse(kbData, {
                keys: ["Heading", "Content", "Keywords"],
                threshold: 0.4,
                includeScore: true
            });

            bar.style.width = "100%";
            status.innerText = "Complete!";
            
            setTimeout(() => {
                document.getElementById('loader').style.opacity = '0';
                setTimeout(() => document.getElementById('loader').style.display = 'none', 600);
            }, 500);

        } catch (error) {
            console.error(error);
            status.innerText = "Connection Error. Please refresh.";
            status.style.color = "var(--pink)";
        }
    }

    window.askBot = function() {
        const inputField = document.getElementById('userInput');
        const query = inputField.value.trim();
        if (!query) return;

        addMessage(query, 'user');
        inputField.value = '';

        // Run Hybrid Search
        const searchResults = fuseIndex.search(query);
        
        setTimeout(() => {
            if (searchResults.length > 0) {
                const best = searchResults[0].item;
                const score = Math.round((1 - searchResults[0].score) * 100);
                const responseText = `<b>${best.Heading}</b><br>${best.Content}<br><small style="color:#aaa; display:block; margin-top:10px;">Confidence Score: ${score}%</small>`;
                addMessage(responseText, 'bot');
                
                // Voice Output
                const utterance = new SpeechSynthesisUtterance(best.Content.substring(0, 200));
                window.speechSynthesis.speak(utterance);
            } else {
                addMessage("I couldn't find a direct answer for that. Try using different keywords or checking our main headers.", 'bot');
            }
        }, 400);
    };

    function addMessage(text, sender) {
        const win = document.getElementById('chat-window');
        const div = document.createElement('div');
        div.className = `msg ${sender}`;
        div.innerHTML = text;
        win.appendChild(div);
        win.scrollTop = win.scrollHeight;
    }

    // Start the engine
    initialize();
</script>

</body>
</html>
