<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TETR WIKI | TRANSFORMER ENGINE</title>
    
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <script src="https://unpkg.com/compromise@14.10.1/builds/compromise.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/languagedetect@2.0.0/lib/index.min.js"></script>

    <style>
        :root { --green: #004822; --pink: #F8769A; --gold: #F0C300; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f2f5; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* INITIAL SETUP OVERLAY */
        #setup-screen { position: fixed; inset: 0; background: var(--green); color: white; z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .card { width: 85%; max-width: 500px; padding: 40px; border: 2px solid var(--gold); border-radius: 30px; background: rgba(0,0,0,0.3); backdrop-filter: blur(15px); }
        .progress-wrap { width: 100%; height: 12px; background: rgba(255,255,255,0.1); border-radius: 6px; margin: 25px 0; overflow: hidden; }
        #fill { width: 0%; height: 100%; background: var(--pink); transition: width 0.4s ease; box-shadow: 0 0 15px var(--pink); }
        
        header { background: var(--green); color: var(--gold); padding: 18px 30px; font-weight: 800; border-bottom: 4px solid var(--gold); display: flex; justify-content: space-between; align-items: center; }
        #chat-wall { flex: 1; overflow-y: auto; padding: 30px; display: flex; flex-direction: column; gap: 20px; }
        
        .msg { max-width: 80%; padding: 18px 25px; border-radius: 20px; font-size: 1rem; line-height: 1.6; box-shadow: 0 4px 15px rgba(0,0,0,0.05); position: relative; }
        .bot { background: white; align-self: flex-start; border-left: 8px solid var(--gold); }
        .user { background: var(--green); color: white; align-self: flex-end; }
        
        .confidence-tag { position: absolute; bottom: -20px; left: 10px; font-size: 0.65rem; color: #888; font-weight: bold; }
        
        .input-dock { padding: 30px; background: white; display: flex; gap: 15px; border-top: 1px solid #eee; }
        input { flex: 1; padding: 16px 28px; border-radius: 40px; border: 2px solid #efefef; outline: none; font-size: 1rem; }
        .btn-v { background: var(--pink); border: none; width: 55px; height: 55px; border-radius: 50%; cursor: pointer; color: white; font-size: 1.2rem; }
        .btn-s { background: var(--green); border: none; padding: 0 40px; border-radius: 40px; color: white; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>

<div id="setup-screen">
    <div class="card">
        <h1 style="letter-spacing: 3px; margin:0;">TETR AI SYSTEM</h1>
        <p id="setup-status">Downloading Knowledge Base...</p>
        <div class="progress-wrap"><div id="fill"></div></div>
        <p style="font-size: 0.75rem; opacity: 0.7;">Syncing all-MiniLM (23MB) & DistilBERT (68MB)</p>
    </div>
</div>

<header>
    <span>TETR WIKI v16.0</span>
    <div id="lang-status" style="font-size: 0.7rem; color: var(--pink); font-family: monospace;">STATION READY</div>
</header>

<div id="chat-wall"></div>

<div class="input-dock">
    <button class="btn-v" onclick="runMic()">🎤</button>
    <input type="text" id="userInput" placeholder="Ask about programs, founders, or fees..." onkeypress="if(event.key==='Enter') window.fireQuery()">
    <button class="btn-s" onclick="window.fireQuery()">GENERATE</button>
</div>

<script type="module">
    import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1';
    
    // THE LINK YOU FIXED IN IMAGE_18C89A
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT9YBoA31_bAI48Dx0Sal0jQpxr6T9V2u7Ry5pnR6R0sCuAaUGSS4skKo-VnkQrJqwylclRylm4zMCW/pub?gid=0&single=true&output=csv";
    
    let kb = [];
    let searcher;
    let detector = new LanguageDetect();

    async function init() {
        const fill = document.getElementById('fill');
        const status = document.getElementById('setup-status');

        try {
            // 1. DATA SYNC (Caching the fetch)
            status.innerText = "Connecting to Tetr Cloud...";
            fill.style.width = "20%";
            const res = await fetch(CSV_URL + "?v=" + Date.now());
            if(!res.ok) throw new Error("HTTP 404/400: CSV Fetch Failed");
            const text = await res.text();
            kb = Papa.parse(text, { header: true, skipEmptyLines: true }).data;

            // 2. AI TRANSFORMER DOWNLOAD (MiniLM & DistilBERT)
            status.innerText = "Caching Transformer Weights (91MB)...";
            fill.style.width = "50%";
            await pipeline('feature-extraction', 'Xenova/all-miniLM-L6-v2');
            fill.style.width = "85%";
            await pipeline('feature-extraction', 'Xenova/distilbert-base-uncased');

            // 3. FUSE SEARCH ENGINE (Confidence Scoring)
            searcher = new Fuse(kb, {
                keys: ['Heading', 'Content', 'Keywords'],
                threshold: 0.4,
                includeScore: true,
                ignoreLocation: true
            });

            fill.style.width = "100%";
            setTimeout(() => {
                document.getElementById('setup-screen').style.display = 'none';
                add("<b>Tetr AI:</b> System Live. I have indexed the 250-page master sheet. How can I assist?", "bot");
            }, 600);

        } catch (e) {
            status.innerText = "ERROR: " + e.message;
            status.style.color = "var(--pink)";
        }
    }

    window.fireQuery = async function() {
        const ui = document.getElementById('userInput');
        const q = ui.value.trim();
        if(!q) return;

        add(q, 'user');
        ui.value = '';

        // NLP Lang Detect
        const detected = detector.detect(q, 1);
        document.getElementById('lang-status').innerText = detected.length ? detected[0][0].toUpperCase() : "DETECTING";

        // Search + Confidence Score
        const hits = searcher.search(q);
        
        if(hits.length > 0) {
            const top = hits[0].item;
            const confidence = Math.round((1 - hits[0].score) * 100);
            
            const html = `<b>${top.Heading}</b><br>${top.Content}<span class="confidence-tag">Match: ${confidence}%</span>`;
            add(html, 'bot');
            
            // Webspeech TTS
            const talk = new SpeechSynthesisUtterance(top.Content.substring(0, 250));
            window.speechSynthesis.speak(talk);
        } else {
            add("I couldn't find a high-confidence match in the wiki. Please rephrase or specify the program.", "bot");
        }
    };

    window.runMic = function() {
        const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if(!Rec) return alert("Browser voice not supported.");
        const r = new Rec();
        r.onresult = (e) => document.getElementById('userInput').value = e.results[0][0].transcript;
        r.start();
    };

    function add(t, c) {
        const wall = document.getElementById('chat-wall');
        const d = document.createElement('div');
        d.className = `msg ${c}`;
        d.innerHTML = t;
        wall.appendChild(d);
        wall.scrollTop = wall.scrollHeight;
    }

    init();
</script>
</body>
</html>
