<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetr Wiki | Intelligence Engine</title>

    <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>
    <script src="https://unpkg.com/compromise"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <script src="https://unpkg.com/franc@6.1.0/dist/franc.min.js"></script>

    <style>
        :root { --tetr-green: #004822; --tetr-pink: #F8769A; --tetr-gold: #F0C300; }
        body { font-family: 'Inter', sans-serif; background: #e9ecef; margin: 0; height: 100vh; display: flex; flex-direction: column; }
        #setup-overlay { position: fixed; inset: 0; background: var(--tetr-green); color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 2000; }
        .loading-card { background: rgba(0,0,0,0.2); padding: 30px; border-radius: 20px; text-align: center; max-width: 400px; border: 1px solid var(--tetr-gold); }
        .progress-bar { width: 100%; height: 8px; background: rgba(255,255,255,0.1); border-radius: 10px; margin: 20px 0; overflow: hidden; }
        #progress-fill { width: 0%; height: 100%; background: var(--tetr-pink); transition: width 0.4s; }
        header { background: var(--tetr-green); color: white; padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between; }
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .msg { max-width: 85%; padding: 15px; border-radius: 15px; line-height: 1.5; font-size: 0.95rem; }
        .bot { background: white; align-self: flex-start; border-left: 5px solid var(--tetr-gold); }
        .user { background: var(--tetr-green); color: white; align-self: flex-end; }
        .input-bar { background: white; padding: 20px; display: flex; gap: 10px; border-top: 1px solid #ddd; }
        input { flex: 1; padding: 12px 20px; border-radius: 25px; border: 1px solid #ccc; outline: none; }
        button { background: var(--tetr-green); color: white; border: none; padding: 10px 25px; border-radius: 25px; cursor: pointer; }
    </style>
</head>
<body>

<div id="setup-overlay">
    <div class="loading-card">
        <h2 style="color: var(--tetr-gold)">TETR AI WIKI</h2>
        <p id="load-status">Connecting to Neural Engine...</p>
        <div class="progress-bar"><div id="progress-fill"></div></div>
        <p style="font-size: 0.7rem; opacity: 0.8;">Caching Transformers (23MB) for offline use.</p>
    </div>
</div>

<header>
    <h1 style="margin:0; font-size: 1.2rem; color: var(--tetr-gold);">TETR WIKI</h1>
    <div style="font-size: 0.7rem; color: var(--tetr-pink);">• AI POWERED</div>
</header>

<div id="chat-container">
    <div class="msg bot"><b>Tetr AI:</b> Intelligence active. Ask me about programs, partners, or policies.</div>
</div>

<div class="input-bar">
    <input type="text" id="userInput" placeholder="Ask a question..." onkeypress="if(event.key==='Enter') window.processQuery()">
    <button onclick="window.processQuery()">SEND</button>
</div>

<script type="module">
    import { pipeline } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1';

    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT9YBoA31_bAI48Dx0Sal0jQpxr6T9V2u7Ry5pnR6R0sCuAaUGSS4skKo-VnkQrJqwylclRylm4zMCW/pub?output=csv";
    
    let kbData = [];
    let fuse;
    let extractor;

    async function init() {
        const bar = document.getElementById('progress-fill');
        const status = document.getElementById('load-status');

        try {
            // Step 1: Data
            status.innerText = "Downloading Knowledge Base...";
            bar.style.width = "30%";
            const res = await fetch(CSV_URL + "?cb=" + Date.now());
            const text = await res.text();
            kbData = Papa.parse(text, { header: true }).data.filter(r => r.Heading);
            
            // Step 2: AI Model
            status.innerText = "Loading MiniLM-L6 (23MB)...";
            bar.style.width = "60%";
            extractor = await pipeline('feature-extraction', 'Xenova/all-MiniLM-L6-v2');

            // Step 3: Indexing
            status.innerText = "Indexing Semantic Data...";
            bar.style.width = "90%";
            fuse = new Fuse(kbData, { keys: ["Heading", "Content", "Keywords"], threshold: 0.4, includeScore: true });

            bar.style.width = "100%";
            status.innerText = "System Live!";
            setTimeout(() => document.getElementById('setup-overlay').style.display = 'none', 600);

        } catch (e) {
            console.error(e);
            status.innerText = "Error: Check your internet or CSV link.";
            status.style.color = "#ff4d4d";
        }
    }

    window.processQuery = async function() {
        const input = document.getElementById('userInput');
        const val = input.value.trim();
        if(!val) return;

        addMsg(val, 'user');
        input.value = '';

        const results = fuse.search(val);
        if(results.length > 0) {
            const best = results[0].item;
            const conf = Math.round((1 - results[0].score) * 100);
            addMsg(`<b>${best.Heading}</b><br>${best.Content}<br><small style="color:#888">Confidence: ${conf}%</small>`, 'bot');
            
            // WebSpeech Support
            const speech = new SpeechSynthesisUtterance(best.Content.substring(0, 150));
            window.speechSynthesis.speak(speech);
        } else {
            addMsg("I couldn't find a direct match. Try different keywords.", 'bot');
        }
    }

    function addMsg(text, type) {
        const chat = document.getElementById('chat-container');
        const div = document.createElement('div');
        div.className = `msg ${type}`;
        div.innerHTML = text;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }

    init();
</script>
</body>
</html>
