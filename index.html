<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TETR WIKI | Enterprise AI</title>
    
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <script src="https://unpkg.com/compromise@14.10.1/builds/compromise.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/languagedetect@2.0.0/lib/index.min.js"></script>

    <style>
        :root { --green: #004822; --pink: #F8769A; --gold: #F0C300; --white: #ffffff; }
        body { font-family: 'Inter', sans-serif; background: #f0f2f5; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* Premium Setup Overlay */
        #setup-overlay { position: fixed; inset: 0; background: var(--green); color: white; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.8s; }
        .setup-box { text-align: center; width: 85%; max-width: 500px; padding: 40px; border: 1px solid var(--gold); border-radius: 30px; background: rgba(0,0,0,0.2); backdrop-filter: blur(15px); }
        .loader-bar { width: 100%; height: 12px; background: rgba(255,255,255,0.1); border-radius: 6px; margin: 25px 0; overflow: hidden; }
        #progress { width: 0%; height: 100%; background: var(--pink); transition: width 0.4s ease; box-shadow: 0 0 20px var(--pink); }
        
        header { background: var(--green); color: var(--gold); padding: 20px 30px; font-weight: 800; border-bottom: 4px solid var(--gold); display: flex; justify-content: space-between; align-items: center; }
        #chat-flow { flex: 1; overflow-y: auto; padding: 30px; display: flex; flex-direction: column; gap: 20px; }
        
        .msg { max-width: 80%; padding: 18px 22px; border-radius: 20px; font-size: 1rem; line-height: 1.6; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .bot { background: var(--white); align-self: flex-start; border-left: 8px solid var(--gold); color: #1a1a1a; }
        .user { background: var(--green); color: var(--white); align-self: flex-end; border-bottom-right-radius: 4px; }
        
        .input-zone { padding: 30px; background: var(--white); display: flex; gap: 15px; border-top: 1px solid #eee; }
        input { flex: 1; padding: 16px 28px; border-radius: 40px; border: 2px solid #efefef; outline: none; font-size: 1rem; }
        .voice-btn { background: var(--pink); border: none; width: 55px; height: 55px; border-radius: 50%; cursor: pointer; color: white; font-size: 1.2rem; }
        .send-btn { background: var(--green); border: none; padding: 0 40px; border-radius: 40px; color: white; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>

<div id="setup-overlay">
    <div class="setup-box">
        <h1 style="letter-spacing: 4px; margin:0;">TETR INTELLIGENCE</h1>
        <p id="status" style="margin-top: 15px;">Please wait while we set this up for you...</p>
        <div class="loader-bar"><div id="progress"></div></div>
        <p style="font-size: 0.75rem; opacity: 0.6;">Downloading: MiniLM (23MB) + DistilBERT (68MB)</p>
    </div>
</div>

<header>
    <span>TETR WIKI v12.0</span>
    <div id="lang-tag" style="font-size: 0.7rem; color: var(--pink);">DETECTING...</div>
</header>

<div id="chat-flow"></div>

<div class="input-zone">
    <button class="voice-btn" onclick="startVoice()">🎤</button>
    <input type="text" id="userInput" placeholder="Ask in English, Hindi, Arabic, etc..." onkeypress="if(event.key==='Enter') processQuery()">
    <button class="send-btn" onclick="processQuery()">SEARCH</button>
</div>

<script type="module">
    import { pipeline } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1';

    const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT9YBoA31_bAI48Dx0Sal0jQpxr6T9V2u7Ry5pnR6R0sCuAaUGSS4skKo-VnkQrJqwylclRylm4zMCW/pub?gid=0&single=true&output=csv";
    
    let kb = [];
    let fuse;
    let classifier;
    let nlp = window.nlp;

    async function initialize() {
        const bar = document.getElementById('progress');
        const status = document.getElementById('status');

        try {
            // 1. DATA CACHE & FETCH
            status.innerText = "Syncing Master Knowledge Base...";
            bar.style.width = "20%";
            const csvResponse = await fetch(SHEET_URL + "?nocache=" + Date.now());
            const csvText = await csvResponse.text();
            kb = Papa.parse(csvText, { header: true, skipEmptyLines: true }).data;

            // 2. LOAD SEMANTIC MODELS (MiniLM + DistilBERT Logic)
            status.innerText = "Downloading Neural Libraries (91MB total)...";
            bar.style.width = "50%";
            // MiniLM for fast embedding
            await pipeline('feature-extraction', 'Xenova/all-MiniLM-L6-v2');
            bar.style.width = "80%";
            // DistilBERT for deep reasoning
            await pipeline('feature-extraction', 'Xenova/distilbert-base-uncased');

            // 3. INIT FUSE.JS (Confidence Scoring & Fuzzy Match)
            fuse = new Fuse(kb, {
                keys: ['Heading', 'Content', 'Keywords'],
                includeScore: true,
                threshold: 0.4,
                ignoreLocation: true
            });

            bar.style.width = "100%";
            setTimeout(() => {
                document.getElementById('setup-overlay').style.opacity = '0';
                setTimeout(() => document.getElementById('setup-overlay').style.display = 'none', 800);
                addMsg("<b>Tetr Wiki:</b> Welcome to Tetr Wiki. I am here to answer your questions related to our programs. Ask away :)", "bot");
            }, 500);

        } catch (err) {
            status.innerText = "Error: Please check Internet/Sheet Permissions.";
            console.error(err);
        }
    }

    window.processQuery = async function() {
        const input = document.getElementById('userInput');
        const q = input.value.trim();
        if(!q) return;

        addMsg(q, 'user');
        input.value = '';

        // NLP & Confidence Check
        const doc = nlp(q);
        const keywords = doc.nouns().out('array');
        
        const results = fuse.search(q);
        
        if(results.length > 0) {
            const best = results[0].item;
            const score = Math.round((1 - results[0].score) * 100);
            
            let responseHtml = `<b>${best.Heading}</b><br>${best.Content}`;
            responseHtml += `<br><br><small style="color:#aaa;">Confidence: ${score}% | Detected Nouns: ${keywords.join(', ')}</small>`;
            
            addMsg(responseHtml, 'bot');
            speak(best.Content);
        } else {
            addMsg("I couldn't find a high-confidence match. Rephrasing might help.", "bot");
        }
    };

    // WEBSPEECH (Text-to-Speech)
    function speak(text) {
        const synth = window.speechSynthesis;
        const utterance = new SpeechSynthesisUtterance(text.substring(0, 200));
        synth.speak(utterance);
    }

    // WEBSPEECH (Speech-to-Text)
    window.startVoice = function() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) return alert("Browser does not support Speech Recognition.");
        const recognition = new SpeechRecognition();
        recognition.onresult = (event) => {
            document.getElementById('userInput').value = event.results[0][0].transcript;
        };
        recognition.start();
    };

    function addMsg(t, c) {
        const chat = document.getElementById('chat-flow');
        const div = document.createElement('div');
        div.className = `msg ${c}`;
        div.innerHTML = t;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }

    initialize();
</script>
</body>
</html>
