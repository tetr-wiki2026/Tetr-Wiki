<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TETR AI WIKI</title>
    
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

    <style>
        :root { --green: #004822; --pink: #F8769A; --gold: #F0C300; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        
        /* Premium Loading Screen */
        #loader { position: fixed; inset: 0; background: var(--green); color: white; z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .loading-box { text-align: center; width: 80%; max-width: 400px; padding: 40px; border: 2px solid var(--gold); border-radius: 25px; background: rgba(0,0,0,0.2); }
        .progress-track { width: 100%; height: 10px; background: rgba(255,255,255,0.1); border-radius: 5px; margin: 20px 0; overflow: hidden; }
        #bar { width: 0%; height: 100%; background: var(--pink); transition: width 0.5s ease; }
        
        header { background: var(--green); color: var(--gold); padding: 15px 25px; font-weight: bold; display: flex; justify-content: space-between; border-bottom: 3px solid var(--gold); }
        #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .msg { max-width: 85%; padding: 15px; border-radius: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); line-height: 1.5; }
        .bot { background: white; align-self: flex-start; border-left: 5px solid var(--gold); }
        .user { background: var(--green); color: white; align-self: flex-end; }
        
        .input-area { padding: 20px; background: white; display: flex; gap: 10px; border-top: 1px solid #ddd; }
        input { flex: 1; padding: 12px 20px; border-radius: 25px; border: 1px solid #ccc; outline: none; font-size: 1rem; }
        button { background: var(--green); color: white; border: none; padding: 10px 25px; border-radius: 25px; cursor: pointer; font-weight: bold; }
        button:hover { background: var(--pink); }
    </style>
</head>
<body>

<div id="loader">
    <div class="loading-box">
        <h1 style="margin:0; letter-spacing: 2px;">TETR AI</h1>
        <p id="status">Connecting to Google Sheets...</p>
        <div class="progress-track"><div id="bar"></div></div>
        <p style="font-size: 0.7rem; opacity: 0.6;">Verified Anonymous Access Mode</p>
    </div>
</div>

<header>
    <span>TETR WIKI v3.0</span>
    <span style="color:var(--pink); font-size: 0.8rem;">● LIVE DATA SYNC</span>
</header>

<div id="chat">
    <div class="msg bot"><b>System:</b> Initializing knowledge base. One moment...</div>
</div>

<div class="input-area">
    <input type="text" id="userInput" placeholder="Ask about programs, fees, or founders..." onkeypress="if(event.key==='Enter') window.ask()">
    <button onclick="window.ask()">ASK</button>
</div>

<script type="module">
    // Load Transformers for Semantic Intelligence
    import { pipeline } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1';

    // THE MAGIC URL (Your Published Link)
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT9YBoA31_bAI48Dx0Sal0jQpxr6T9V2u7Ry5pnR6R0sCuAaUGSS4skKo-VnkQrJqwylclRylm4zMCW/pub?gid=0&single=true&output=csv";
    
    let kb = [];
    let fuse;

    async function init() {
        const bar = document.getElementById('bar');
        const status = document.getElementById('status');

        try {
            // Step 1: Fetching CSV
            status.innerText = "Downloading CSV Data...";
            bar.style.width = "30%";
            
            // We use 'no-cache' to ensure we always get the latest sheet edits
            const response = await fetch(CSV_URL, { cache: "no-store" });
            if (!response.ok) throw new Error("Fetch Failed");
            
            const text = await response.text();
            
            // Step 2: Parse CSV
            kb = Papa.parse(text, { header: true, skipEmptyLines: true }).data;
            bar.style.width = "50%";
            
            // Step 3: Setup Index
            status.innerText = "Building Search Index...";
            fuse = new Fuse(kb, {
                keys: ["Heading", "Content", "Keywords"],
                threshold: 0.35,
                includeScore: true
            });
            bar.style.width = "70%";

            // Step 4: AI Model (Background load)
            status.innerText = "Activating AI Brain (23MB)...";
            try {
                await pipeline('feature-extraction', 'Xenova/all-MiniLM-L6-v2');
            } catch(e) {
                console.warn("AI Model took too long, falling back to standard search.");
            }

            // Step 5: Finalize
            bar.style.width = "100%";
            status.innerText = "System Active!";
            setTimeout(() => {
                document.getElementById('loader').style.display = 'none';
                addMsg("<b>Tetr AI:</b> Hello! I have processed the 250-page master sheet. How can I help you support our candidates today?", "bot");
            }, 600);

        } catch (error) {
            console.error(error);
            status.innerText = "Google Connection Error. Please verify 'Publish to Web' is active.";
            status.style.color = "var(--pink)";
        }
    }

    window.ask = function() {
        const input = document.getElementById('userInput');
        const q = input.value.trim();
        if (!q) return;

        addMsg(q, 'user');
        input.value = '';

        // Search logic
        const results = fuse.search(q);
        
        if (results.length > 0) {
            const match = results[0].item;
            const score = Math.round((1 - results[0].score) * 100);
            addMsg(`<b>${match.Heading}</b><br>${match.Content}<br><small style="color:#aaa; display:block; margin-top:10px;">Relevance: ${score}%</small>`, 'bot');
            
            // TTS Voice
            const speech = new SpeechSynthesisUtterance(match.Content.substring(0, 180));
            window.speechSynthesis.speak(speech);
        } else {
            addMsg("I couldn't find a direct answer. Try asking about a specific topic like 'Admission Process' or 'Fees'.", 'bot');
        }
    };

    function addMsg(text, type) {
        const chat = document.getElementById('chat');
        const d = document.createElement('div');
        d.className = `msg ${type}`;
        d.innerHTML = text;
        chat.appendChild(d);
        chat.scrollTop = chat.scrollHeight;
    }

    init();
</script>
</body>
</html>
