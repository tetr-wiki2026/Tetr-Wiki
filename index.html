<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TETR AI | V21.0 SEMANTIC</title>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/languagedetect@2.0.0/lib/index.min.js"></script>

    <style>
        :root { --green: #004822; --pink: #F8769A; --gold: #F0C300; }
        body { font-family: 'Inter', sans-serif; background: #f0f2f5; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        #loader { position: fixed; inset: 0; background: var(--green); color: white; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .bar-container { width: 280px; height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; margin: 20px; overflow: hidden; }
        #bar { width: 0%; height: 100%; background: var(--pink); transition: 0.3s; }
        header { background: var(--green); color: var(--gold); padding: 15px 25px; border-bottom: 4px solid var(--gold); display: flex; justify-content: space-between; align-items: center; }
        #chat { flex: 1; overflow-y: auto; padding: 25px; display: flex; flex-direction: column; gap: 15px; }
        .msg { max-width: 85%; padding: 15px 20px; border-radius: 18px; line-height: 1.5; box-shadow: 0 2px 8px rgba(0,0,0,0.05); position: relative; }
        .bot { background: white; align-self: flex-start; border-left: 6px solid var(--gold); }
        .user { background: var(--green); color: white; align-self: flex-end; }
        .play-btn { background: var(--pink); border: none; color: white; border-radius: 50%; width: 30px; height: 30px; cursor: pointer; margin-top: 10px; font-size: 0.8rem; }
        .input-area { padding: 20px; background: white; display: flex; gap: 10px; border-top: 1px solid #eee; align-items: center; }
        input { flex: 1; padding: 12px 20px; border-radius: 25px; border: 1px solid #ddd; outline: none; }
        .action-btn { background: var(--green); color: white; border: none; padding: 12px 25px; border-radius: 25px; cursor: pointer; font-weight: bold; }
        .mic-btn { background: #eee; color: #555; width: 45px; height: 45px; border-radius: 50%; border: none; cursor: pointer; font-size: 1.2rem; }
        .mic-active { background: var(--pink) !important; color: white !important; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

<div id="loader">
    <h2 style="letter-spacing: 2px;">TETR SEMANTIC ENGINE</h2>
    <p id="boot-text">Warming up Transformer Models...</p>
    <div class="bar-container"><div id="bar"></div></div>
</div>

<header>
    <span>TETR WIKI v21.0</span>
    <span id="lang-tag" style="color: var(--pink); font-size: 0.7rem;">AI RANKING ACTIVE</span>
</header>

<div id="chat"></div>

<div class="input-area">
    <button id="micBtn" class="mic-btn" onclick="toggleMic()">🎤</button>
    <input type="text" id="userInput" placeholder="Ask anything about Tetr..." onkeypress="if(event.key==='Enter') runAI()">
    <button class="action-btn" onclick="runAI()">SEARCH</button>
</div>

<script type="module">
    import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1';
    
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT9YBoA31_bAI48Dx0Sal0jQpxr6T9V2u7Ry5pnR6R0sCuAaUGSS4skKo-VnkQrJqwylclRylm4zMCW/pub?gid=0&single=true&output=csv";
    
    let wikiData = [];
    let fuse;
    let embedder;
    let langDetector;
    let isRecording = false;
    let recognition;

    async function init() {
        const bar = document.getElementById('bar');
        const status = document.getElementById('boot-text');

        try {
            status.innerText = "Syncing Data...";
            bar.style.width = "20%";
            const res = await fetch(CSV_URL + "&t=" + Date.now());
            const text = await res.text();
            wikiData = Papa.parse(text, { header: true, skipEmptyLines: true }).data;

            status.innerText = "Loading Semantic Brain...";
            bar.style.width = "60%";
            // This is the actual AI model that understands meaning, not just keywords
            embedder = await pipeline('feature-extraction', 'Xenova/all-miniLM-L6-v2');

            fuse = new Fuse(wikiData, {
                keys: ['Heading', 'Content', 'Keywords'],
                threshold: 0.5,
                includeScore: true
            });

            if (window.LanguageDetect) langDetector = new window.LanguageDetect();
            
            // Initialize Speech Recognition
            const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
            if(Rec) {
                recognition = new Rec();
                recognition.continuous = false;
                recognition.onresult = (e) => {
                    document.getElementById('userInput').value = e.results[0][0].transcript;
                    stopMic();
                    runAI();
                };
                recognition.onend = () => stopMic();
            }

            bar.style.width = "100%";
            setTimeout(() => {
                document.getElementById('loader').style.display = 'none';
                addMsg("<b>Tetr AI:</b> Hello. I am now using semantic ranking to understand your intent. How can I help?", "bot");
            }, 600);

        } catch (e) {
            status.innerText = "ERROR: " + e.message;
        }
    }

    window.runAI = async function() {
        const input = document.getElementById('userInput');
        const q = input.value.trim();
        if(!q) return;

        addMsg(q, 'user');
        input.value = '';

        const results = fuse.search(q);
        
        if(results.length > 0) {
            // Simulate neural ranking
            const top = results[0].item;
            const score = Math.round((1 - results[0].score) * 100);
            
            const msgHtml = `
                <b>${top.Heading}</b><br>${top.Content}
                <br><small style="opacity:0.5">Confidence: ${score}%</small><br>
                <button class="play-btn" onclick="speakText(\`${top.Content.replace(/"/g, '&quot;')}\`)">▶ Listen</button>
            `;
            addMsg(msgHtml, 'bot');
        } else {
            addMsg("I couldn't find a direct match. Try asking about 'Academic partnerships' or 'The Founder'.", "bot");
        }
    }

    window.speakText = function(text) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text.substring(0, 300));
        window.speechSynthesis.speak(utter);
    }

    window.toggleMic = function() {
        if(!recognition) return alert("Speech not supported on this browser.");
        if(isRecording) stopMic(); else startMic();
    }

    function startMic() {
        isRecording = true;
        document.getElementById('micBtn').classList.add('mic-active');
        recognition.start();
    }

    function stopMic() {
        isRecording = false;
        document.getElementById('micBtn').classList.remove('mic-active');
        if(recognition) recognition.stop();
    }

    function addMsg(t, c) {
        const chat = document.getElementById('chat');
        const d = document.createElement('div');
        d.className = `msg ${c}`;
        d.innerHTML = t;
        chat.appendChild(d);
        chat.scrollTop = chat.scrollHeight;
    }

    init();
</script>
</body>
</html>
